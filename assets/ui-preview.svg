<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="prefix-doctor Monochrome Web UI and CLI Preview">
  <rect width="900" height="430" fill="#FFFFFF" />
  <rect x="6" y="6" width="888" height="418" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2" />

  <!-- Browser Window -->
  <rect x="22" y="22" width="546" height="386" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.8" />
  <rect x="22" y="22" width="546" height="28" fill="#F7F7F7" stroke="#0A0A0A" stroke-width="1.4" />
  <circle cx="38" cy="36" r="4" fill="#DC2626" />
  <circle cx="52" cy="36" r="4" fill="#CA8A04" />
  <circle cx="66" cy="36" r="4" fill="#16A34A" />
  <text x="84" y="40" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="700" fill="#0A0A0A">http://127.0.0.1:4949 — prefix-doctor Web Clinic</text>

  <!-- KPI Row -->
  <g transform="translate(34, 62)">
    <rect x="0" y="0" width="124" height="50" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.2" />
    <text x="8" y="14" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="7.8" fill="#525252">BEFORE GRADE</text>
    <circle cx="14" cy="30" r="4" fill="#DC2626" />
    <text x="23" y="34" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="800" fill="#0A0A0A">WRITE TAX</text>
    <text x="8" y="45" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="7.5" fill="#525252">0.0% KV hit rate</text>

    <rect x="132" y="0" width="124" height="50" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.2" />
    <text x="140" y="14" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="7.8" fill="#525252">AFTER HEAL</text>
    <circle cx="146" cy="30" r="4" fill="#16A34A" />
    <text x="155" y="34" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="800" fill="#0A0A0A">98.9%</text>
    <text x="140" y="45" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="7.5" fill="#525252">Warm KV prefix</text>

    <rect x="264" y="0" width="124" height="50" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.2" />
    <text x="272" y="14" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="7.8" fill="#525252">COST DROP</text>
    <circle cx="278" cy="30" r="4" fill="#16A34A" />
    <text x="287" y="34" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="800" fill="#0A0A0A">-87%</text>
    <text x="272" y="45" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="7.5" fill="#525252">Saved $4.99</text>

    <rect x="396" y="0" width="126" height="50" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.2" />
    <text x="404" y="14" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="7.8" fill="#525252">BREAK-EVEN p*</text>
    <circle cx="410" cy="30" r="4" fill="#CA8A04" />
    <text x="419" y="34" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="800" fill="#0A0A0A">21.7%</text>
    <text x="404" y="45" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="7.5" fill="#525252">Anthropic 5m TTL</text>
  </g>

  <!-- Turn-by-Turn Bars -->
  <g transform="translate(34, 124)">
    <rect x="0" y="0" width="522" height="142" fill="#F7F7F7" stroke="#0A0A0A" stroke-width="1.3" />
    <text x="10" y="18" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="9.5" font-weight="800" fill="#0A0A0A">TURN-BY-TURN KV PREFIX X-RAY (GREEN = CACHED · RED = BUSTED)</text>

    <text x="10" y="38" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="8.5" fill="#0A0A0A">Turn 1 [WARMUP]</text>
    <rect x="130" y="28" width="220" height="12" fill="#CA8A04" stroke="#0A0A0A" stroke-width="1" />
    <text x="358" y="38" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="8.5" fill="#525252">write 5,800 tok</text>

    <text x="10" y="60" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="8.5" fill="#DC2626">Turn 2 [BUSTED]</text>
    <rect x="130" y="50" width="250" height="12" fill="#DC2626" stroke="#0A0A0A" stroke-width="1" />
    <text x="388" y="60" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="8.5" font-weight="700" fill="#DC2626">0% hit (byte 14!)</text>

    <rect x="10" y="70" width="502" height="30" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2" />
    <circle cx="22" cy="85" r="3.5" fill="#DC2626" />
    <text x="32" y="88" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="8.4" fill="#0A0A0A">VOLATILE_TIMESTAMP: "Current time: 2026-11-24T15:44:07Z" in system</text>

    <text x="10" y="122" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="8.5" font-weight="700" fill="#16A34A">Turn 2 [HEALED]</text>
    <rect x="130" y="112" width="236" height="12" fill="#16A34A" stroke="#0A0A0A" stroke-width="1" />
    <rect x="366" y="112" width="18" height="12" fill="#CA8A04" stroke="#0A0A0A" stroke-width="1" />
    <text x="392" y="122" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="8.5" font-weight="800" fill="#16A34A">96% hit · -88% $</text>
  </g>

  <!-- Code Auditor Panel -->
  <g transform="translate(34, 278)">
    <rect x="0" y="0" width="522" height="118" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.3" />
    <rect x="0" y="0" width="522" height="22" fill="#F7F7F7" stroke="#0A0A0A" stroke-width="1" />
    <text x="10" y="15" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="8.5" font-weight="800" fill="#0A0A0A">STATIC PROMPT-BUILDER CODE AUDITOR (JS / TS / PYTHON)</text>
    <circle cx="16" cy="40" r="3.5" fill="#DC2626" />
    <text x="26" y="43" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="8.6" font-weight="700" fill="#0A0A0A">[CRITICAL] SRC_TIMESTAMP_IN_SYSTEM (agent.ts:1)</text>
    <circle cx="16" cy="64" r="3.5" fill="#DC2626" />
    <text x="26" y="67" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="8.6" font-weight="700" fill="#0A0A0A">[CRITICAL] SRC_UUID_IN_SYSTEM (agent.ts:2)</text>
    <circle cx="16" cy="88" r="3.5" fill="#CA8A04" />
    <text x="26" y="91" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="8.6" fill="#0A0A0A">[HIGH] SRC_UNSORTED_TOOLS_ENUM (agent.ts:6)</text>
    <text x="26" y="109" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="8" fill="#525252">Catches cache-busting bugs in CI before deploying agents</text>
  </g>

  <!-- RIGHT PANE: Terminal CLI -->
  <g transform="translate(584, 22)">
    <rect x="0" y="0" width="294" height="386" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="1.8" />
    <rect x="0" y="0" width="294" height="28" fill="#262626" stroke="#0A0A0A" stroke-width="1" />
    <circle cx="16" cy="14" r="3.5" fill="#DC2626" />
    <circle cx="29" cy="14" r="3.5" fill="#CA8A04" />
    <circle cx="42" cy="14" r="3.5" fill="#16A34A" />
    <text x="58" y="18" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="9.5" font-weight="700" fill="#FFFFFF">zsh — prefix-doctor CLI</text>

    <g font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="8.6" fill="#FFFFFF">
      <text x="12" y="50" fill="#D4D4D4">$ prefix-doctor diagnose trace.jsonl</text>
      <circle cx="16" cy="68" r="3" fill="#DC2626" />
      <text x="25" y="71" font-weight="700" fill="#DC2626">WRITE_TAX_LOSS (0.0% hit)</text>
      <text x="20" y="87" fill="#FFFFFF">Actual: $5.73 vs Opt $0.75</text>
      <text x="20" y="103" fill="#CA8A04">Culprit: VOLATILE_TIMESTAMP</text>

      <text x="12" y="132" fill="#D4D4D4">$ prefix-doctor heal trace.jsonl</text>
      <circle cx="16" cy="150" r="3" fill="#16A34A" />
      <text x="25" y="153" font-weight="700" fill="#16A34A">Hit: 0% -&gt; 98.9%</text>
      <text x="20" y="169" fill="#16A34A">Cost: -$4.99 (-87%)</text>

      <text x="12" y="198" fill="#D4D4D4">$ prefix-doctor proxy --heal</text>
      <circle cx="16" cy="216" r="3" fill="#16A34A" />
      <text x="25" y="219">Listening :4949 (auto-heal ON)</text>
      <text x="20" y="235" fill="#D4D4D4">POST /v1/messages</text>
      <text x="20" y="250" fill="#D4D4D4">POST /v1/chat/completions</text>

      <text x="12" y="280" fill="#D4D4D4">$ prefix-doctor breakeven</text>
      <text x="16" y="298" fill="#CA8A04">anthropic_5m   1.25x -&gt; 21.7%</text>
      <text x="16" y="314" fill="#DC2626">anthropic_1h   2.00x -&gt; 52.6%</text>
      <text x="16" y="330" fill="#16A34A">openai_std     1.00x -&gt;  0.0%</text>
      <text x="16" y="346" fill="#16A34A">deepseek_auto  1.00x -&gt;  0.0%</text>
      <text x="16" y="370" fill="#16A34A">exit 0 · zero dependencies</text>
    </g>
  </g>
</svg>
